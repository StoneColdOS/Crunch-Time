<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crunch Time</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=VT323&display=swap">
<style>
/* Layout: handheld shell. Portrait = HUD, 16:9 screen, hands, D-pad + A/B. Landscape = D-pad | screen | A/B.
   Look: a 90s fast-food kitchen at 1 a.m., seen through a PS1 survival-horror lens. Fog, grime, typewriter text, receipt-paper tickets. */
:root{
  --bg:#0e0c0b; --shell:#24201d; --shell-2:#332d28; --ink:#050404;
  --fg:#d8cfbf; --muted:#8c8275;
  --paper:#d6cdb8; --paper-ink:#2a2018;
  --red:#a32020; --amber:#c9a13a; --sick:#8fa060;
  --type:"Special Elite", "Courier New", monospace;
  --vt:"VT323", "Courier New", monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:radial-gradient(ellipse at 50% 30%, #1c1815 0%, var(--bg) 70%);background-color:var(--bg);
  color:var(--fg);font-family:var(--type);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#app{height:100%;box-sizing:border-box;max-width:1200px;margin:0 auto;
  padding-left:max(12px, env(safe-area-inset-left,0px));padding-right:max(12px, env(safe-area-inset-right,0px));padding-block:8px;
  display:grid;gap:10px;grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto 1fr;
  grid-template-areas:"hud hud" "screen screen" "below below" "dpad btns"}
@media (orientation:landscape) and (min-width:600px){
  #app{grid-template-columns:auto 1fr auto;grid-template-rows:auto 1fr auto;
    grid-template-areas:"hud hud hud" "dpad screen btns" ". below ."; align-items:center}
}

/* HUD */
.hud{grid-area:hud;display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:2px 4px;border-bottom:1px solid #3a332d}
.logo{font-size:20px;letter-spacing:.18em;color:var(--fg);text-transform:uppercase}
.logo span{color:var(--red)}
.stats{display:flex;gap:16px;align-items:baseline;font-family:var(--vt);font-size:24px;font-variant-numeric:tabular-nums;color:var(--muted)}
.cash{color:var(--amber)}
.strikes{letter-spacing:.1em}
.strikes span{opacity:.25}
.strikes span.on{opacity:1;color:var(--red);text-shadow:0 0 6px var(--red)}

/* Screen */
.screen{grid-area:screen;position:relative;justify-self:center;width:100%;max-width:100%;container-type:inline-size;
  border:3px solid #000;outline:1px solid #3a332d;background:#000;overflow:hidden}
@media (orientation:landscape) and (min-width:600px){
  .screen{width:min(100%, calc((100dvh - 150px) * 16 / 9))}
}
canvas{display:block;width:100%;aspect-ratio:16/9;image-rendering:pixelated;filter:contrast(1.12) saturate(.72) brightness(.97)}
.fx{position:absolute;inset:0;pointer-events:none}
.grain{width:100%;height:100%;image-rendering:pixelated;mix-blend-mode:overlay;opacity:.16;display:block}
.vig{background:radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.78) 100%),
  repeating-linear-gradient(to bottom, rgba(0,0,0,.16) 0 1px, transparent 1px 3px)}
.cut{background:#000;opacity:0;transition:opacity .12s}
.cut.on{opacity:.85;transition:none}
#ui{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.icon{width:100%;height:100%;image-rendering:pixelated;display:block;filter:saturate(.75) brightness(.95)}

/* ticket rail */
.rail{position:absolute;top:0;left:2cqw;right:2cqw;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.4cqw;align-items:start}
.rail::before{content:"";position:absolute;left:-2cqw;right:-2cqw;top:0;height:1.1cqw;background:linear-gradient(#5a524a,#2a2420);border-bottom:.2cqw solid #000}
.ticket{position:relative;margin-top:.6cqw;background:var(--paper);color:var(--paper-ink);padding:.9cqw .9cqw 1.3cqw;font:1.5cqw/1.15 var(--type);
  transform:rotate(var(--r,0deg));box-shadow:0 .4cqw .6cqw rgba(0,0,0,.6);display:grid;gap:.5cqw;
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - .8cqw) no-repeat, conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/1.6cqw .8cqw repeat-x;
  mask:linear-gradient(#000 0 0) top/100% calc(100% - .8cqw) no-repeat, conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/1.6cqw .8cqw repeat-x}
.ticket.empty{visibility:hidden}
.ticket.near{background:#efe3a8}
.ticket .top{display:flex;justify-content:space-between;gap:.5cqw;white-space:nowrap;overflow:hidden}
.ticket .num{color:var(--red)}
.ticket .items{display:flex;flex-wrap:wrap;gap:.3cqw}
.ticket .items i{position:relative;width:2.8cqw;height:2.8cqw;display:block}
.ticket .items i.done{opacity:.3}
.ticket .items i.done::after{content:"";position:absolute;left:-.2cqw;right:-.2cqw;top:50%;height:.3cqw;background:var(--paper-ink);transform:rotate(-20deg)}
.ticket .wait{height:.5cqw;background:rgba(42,32,24,.2)}
.ticket .wait b{display:block;height:100%;background:var(--paper-ink)}
.ticket.late .wait b{background:var(--red)}
.ticket.late{animation:shiver .18s steps(2) infinite}
@keyframes shiver{50%{transform:rotate(var(--r,0deg)) translateX(.15cqw)}}

/* world tags */
.tag{position:absolute;transform:translate(-50%,-100%);display:grid;justify-items:center;gap:.4cqw}
.sign{display:flex;align-items:center;gap:.5cqw;background:rgba(14,12,11,.82);border:.2cqw solid #4a4038;color:var(--amber);
  font:1.45cqw var(--type);letter-spacing:.12em;padding:.35cqw .7cqw;white-space:nowrap;text-transform:uppercase}
.sign i{width:2.2cqw;height:2.2cqw;display:block}
.tag.near .sign{color:#f3e2a0;border-color:var(--amber);background:rgba(40,32,18,.9)}
.stat{font:1.4cqw var(--type);color:var(--fg);background:rgba(0,0,0,.7);padding:.2cqw .6cqw}
.stat .bar{width:8cqw;height:.6cqw;background:#2a2420;margin-top:.2cqw}
.stat .bar b{display:block;height:100%;background:var(--amber)}
.stat.ready{color:var(--sick);animation:pulse 1s steps(2) infinite}
@keyframes pulse{50%{opacity:.4}}
.held{display:flex;gap:.25cqw;background:rgba(0,0,0,.55);padding:.25cqw}
.held i{width:2.4cqw;height:2.4cqw;display:block;padding:.15cqw}
.held i.sel{outline:.25cqw solid var(--amber);background:rgba(201,161,58,.25)}
.float{position:absolute;transform:translate(-50%,-100%);font:1.9cqw var(--type);white-space:nowrap;text-shadow:.2cqw .2cqw 0 #000;animation:rise 1.6s forwards}
@keyframes rise{to{transform:translate(-50%,-240%);opacity:0}}
.msg{position:absolute;left:50%;bottom:3cqw;transform:translateX(-50%);color:#e9e2d2;font:2cqw var(--type);text-shadow:.2cqw .2cqw 0 #000, 0 0 1cqw #000;white-space:nowrap}

/* Hands + hint */
.below{grid-area:below;display:grid;gap:6px;justify-items:center}
.hands{display:flex;align-items:center;gap:6px;background:var(--shell);border:1px solid #3a332d;padding:5px 8px}
.hands .lbl{font-family:var(--vt);font-size:18px;color:var(--muted);margin:0 2px}
.hands .s{width:30px;height:30px;box-sizing:border-box;border:1px dashed #4a4038;display:grid;place-items:center}
.hands .s.full{border:1px solid #6a5e52;background:#1a1714}
.hands .s.sel{border:2px solid var(--amber);background:#2e2616}
.hands img{width:24px;height:24px;image-rendering:pixelated;filter:saturate(.75)}
.hint{text-align:center;font-size:13px;color:var(--muted);min-height:16px;line-height:1.3}

/* Controls */
.left,.right{display:grid;justify-items:center;gap:12px;align-content:start}
.left{grid-area:dpad}.right{grid-area:btns}
.sh{width:84px;height:28px;border:1px solid #000;border-radius:8px 8px 4px 4px;background:var(--shell-2);color:var(--muted);font:16px var(--vt);box-shadow:0 3px 0 #000;cursor:pointer;touch-action:none;padding:0}
.dpad{display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,50px)}
.pad{border:1px solid #000;background:var(--shell-2);color:var(--muted);font-size:14px;display:grid;place-items:center;box-shadow:0 3px 0 #000;cursor:pointer;touch-action:none;padding:0}
.pad[data-k=up]{grid-area:1/2;border-radius:8px 8px 0 0}
.pad[data-k=left]{grid-area:2/1;border-radius:8px 0 0 8px}
.pad[data-k=right]{grid-area:2/3;border-radius:0 8px 8px 0}
.pad[data-k=down]{grid-area:3/2;border-radius:0 0 8px 8px}
.dpad .hub{grid-area:2/2;background:var(--shell-2)}
.btns{display:grid;grid-template-columns:repeat(2,64px);gap:10px;transform:rotate(-14deg);margin-top:14px}
.ab{width:64px;height:64px;border-radius:50%;border:1px solid #000;font:24px var(--vt);box-shadow:0 4px 0 #000;cursor:pointer;touch-action:none;display:grid;place-items:center;padding:0;background:var(--shell-2)}
.ab[data-k=a]{color:var(--amber);margin-top:-22px;grid-column:2}
.ab[data-k=b]{color:#c46a6a;grid-column:1;grid-row:1;margin-top:18px}
.pad.on,.ab.on,.sh.on{transform:translateY(3px);box-shadow:none;filter:brightness(1.3)}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* Overlay */
.overlay{position:fixed;inset:0;background:rgba(5,4,4,.88);display:flex;align-items:center;justify-content:center;z-index:10;
  padding:max(16px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) max(16px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.card{max-width:480px;width:100%;box-sizing:border-box;max-height:100%;overflow:auto;display:grid;gap:14px;padding:8px}
.card h1{font:400 38px/1.05 var(--type);letter-spacing:.12em;color:var(--fg);margin:0;text-transform:uppercase;text-wrap:balance}
.card h1 em{font-style:normal;color:var(--red)}
.card p{margin:0;line-height:1.5;color:var(--muted);font-size:15px}
.card ul{margin:0;padding-left:18px;line-height:1.55;font-size:14px;color:var(--fg)}
.card .big{font:30px var(--vt);color:var(--amber)}
.card .keys{font-size:12px}
.go{border:1px solid #6a5e52;background:transparent;color:var(--fg);font:20px var(--type);letter-spacing:.2em;text-transform:uppercase;padding:12px;cursor:pointer}
.go:hover,.go:focus-visible{background:var(--fg);color:var(--bg)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div id="app">
  <div class="hud">
    <div class="logo">Crunch <span>Time</span></div>
    <div class="stats">
      <div class="cash">$<span id="cash">0</span></div>
      <div class="strikes" id="strikes" title="Calls to corporate"><span>☎&#xFE0E;</span><span>☎&#xFE0E;</span><span>☎&#xFE0E;</span></div>
      <div id="clock">1:00 AM</div>
    </div>
  </div>

  <div class="screen">
    <canvas id="cv"></canvas>
    <div class="fx"><canvas class="grain" id="grain" width="160" height="90"></canvas></div>
    <div class="fx vig"></div>
    <div class="fx cut" id="cut"></div>
    <div id="ui"><div class="rail" id="rail"></div></div>
  </div>

  <div class="below">
    <div class="hands" id="hands"></div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="left">
    <button class="sh" data-k="l" aria-label="L, previous item">L</button>
    <div class="dpad">
      <button class="pad" data-k="up" aria-label="Walk up">▲</button>
      <button class="pad" data-k="left" aria-label="Walk left">◀</button>
      <div class="hub"></div>
      <button class="pad" data-k="right" aria-label="Walk right">▶</button>
      <button class="pad" data-k="down" aria-label="Walk down">▼</button>
    </div>
  </div>
  <div class="right">
    <button class="sh" data-k="r" aria-label="R, next item">R</button>
    <div class="btns">
      <button class="ab" data-k="b" aria-label="B, toss item">B</button>
      <button class="ab" data-k="a" aria-label="A, grab, cook or bag">A</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="card" id="card"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= TUNING (change numbers here, not in the code) ================= */
const T={
  SHIFT:180,            // seconds per shift (shown as 1:00 AM to 4:00 AM)
  HANDS:5,              // max items carried
  SPEED:3.6,            // walk speed, tiles/sec
  STRIKES:3,            // calls to corporate before the shift ends
  PATIENCE_BASE:18,     // seconds of patience for any order
  PATIENCE_PER_ITEM:5,  // extra seconds per item ordered
  PATIENCE_LATE:.75,    // patience multiplier by end of shift
  SPAWN_START:8, SPAWN_END:4,            // seconds between customers
  SIZE_START:[1,3], SIZE_END:[2,5],      // order size range, start -> end of shift
  WRONG_CASH:1, WRONG_PATIENCE:.15,      // wrong item in a bag
  TOSS_CASH:1,          // tossing an item
  TIP_MAX:.6,           // tip as share of order price at full patience
  REACH:.85,            // how close you must stand to use a station
  FOG:[2.5,15],         // fog start / end distance
};
const RES=[320,180];

/* ================= data ================= */
const ITEMS={
  taco:   {n:'Crunchy Taco', price:2},
  burrito:{n:'Bean Burrito', price:3},
  nachos: {n:'Nacho Pile',   price:3},
  quesa:  {n:'Quesadilla',   price:4},
  drink:  {n:'Blue Blast',   price:2},
};
const ITEM_IDS=Object.keys(ITEMS);
// footprint [x0,z0,x1,z1]; layout follows docs/sketches/2026-11-03-kitchen-layout.jpg
const STATIONS=[
  {id:'quesa',  label:'Grill',    kind:'machine', cook:5, verb:'grill a', fp:[-6.9,1.2,-5.5,2.8]},
  {id:'burrito',label:'Burritos', kind:'grab',                fp:[-6.9,4.7,-5.5,6.3]},
  {id:'taco',   label:'Tacos',    kind:'grab',                fp:[0.4,2.4,2.6,3.6]},
  {id:'nachos', label:'Nachos',   kind:'grab',                fp:[5.5,1.3,6.9,2.7]},
  {id:'drink',  label:'Fountain', kind:'machine', cook:3, verb:'pour a', fp:[5.4,5.1,6.8,6.5]},
];
const SLOT_X=[-4.5,-1.5,1.5,4.5];
const BOUNDS={x0:-6.7,x1:6.7,z0:.4,z1:7.7};
const CUST_Z=-1.8, COUNTER_H=.9;
// fixed camera angles, Resident Evil style. Zone is picked from where you stand.
const CAMS={
  cL:{pos:[3.4,3.5,4.4], at:[-3.8,.9,-.9], fov:55},   // counter, left half
  cR:{pos:[-3.4,3.5,4.4],at:[3.8,.9,-.9],  fov:55},   // counter, right half
  L: {pos:[2.0,4.0,7.6], at:[-6.2,.5,3.6], fov:58},   // grill + burritos
  R: {pos:[-2.0,4.0,7.6],at:[5.6,.5,3.6],  fov:58},   // tacos, nachos, fountain
};
const NAMES=['Dusty','Tess','Marco','Lou','Pam','Rico','Junie','Skeeter','Dana','Hank','Bree','Otis','Lupe','Gus','Wren','Moe','Earl','Vera'];
const HAIR=[0x2a1a10,0x101010,0x8a7a4a,0x5a2a14,0x3a3040,0x9a9a90];
const SHIRT=[0x5a4a3a,0x3a4a5a,0x6a3a3a,0x4a5a3a,0x7a6a50,0x3a3a40,0x5a3a4a];
const SKIN=[0xc9a088,0xa07a60,0x6a4a38,0xd8bca8,0x8a6a58];

/* 8x8 pixel icons for the UI */
const PAL={k:'#1a0b33',c:'#ffd23f',g:'#5fe08a',r:'#8a3b1a',w:'#fff0c8',a:'#b8b8d0',y:'#ff9a1f',o:'#a0522d',b:'#2ec5ff',l:'#bff0ff'};
const FOOD={
  taco:   ["........","..kkkk..",".kgrgrk.","kcgrgrck","kcccccck",".kcccck.","..kkkk..","........"],
  burrito:["........",".kkkkkk.","kwwwwwwk","kwwywwwk","kwwwwwwk","kaaaaaak",".kkkkkk.","........"],
  drink:  ["....kk..","....k...",".kkkkkk.",".kblbbk.",".kbbbbk.","..kbbk..","..kbbk..","..kkkk.."],
  nachos: ["........","..k..k..",".kck.kck","kcykkcyk","kyyyyyyk","kwwwwwwk",".kkkkkk.","........"],
  quesa:  ["........","...kkk..","..kccck.",".kcocock","kcococck","kcccccck","kkkkkkkk","........"],
};
const ICON={};
for(const id of ITEM_IDS){
  const c=document.createElement('canvas'); c.width=c.height=8; const x=c.getContext('2d');
  FOOD[id].forEach((row,r)=>[...row].forEach((ch,col)=>{ if(ch!=='.'){ x.fillStyle=PAL[ch]; x.fillRect(col,r,1,1);} }));
  ICON[id]=c.toDataURL();
}
const img=id=>`<img class="icon" src="${ICON[id]}" alt="${ITEMS[id].n}">`;

const $=id=>document.getElementById(id);
const lerp=(a,b,t)=>a+(b-a)*t;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function rng(seed){ let s=seed; return ()=>(s=(s*16807)%2147483647)/2147483647; }

/* ================= 3D scene ================= */
let renderer, scene, camera, player, stationObjs=[], slotBags=[], lights=[], neon, camKey='L';
function psx(m){
  m.onBeforeCompile=sh=>{
    sh.vertexShader=sh.vertexShader.replace('#include <project_vertex>',
      '#include <project_vertex>\nvec4 sp=gl_Position; sp.xyz/=sp.w; sp.xy=floor(sp.xy*vec2(160.0,90.0)+0.5)/vec2(160.0,90.0); sp.xyz*=sp.w; gl_Position=sp;');
  };
  return m;
}
const mat=(color,o={})=>psx(new THREE.MeshLambertMaterial({color,...o}));
function tex(w,h,draw,rx=1,ry=1){
  const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c); t.magFilter=t.minFilter=THREE.NearestFilter; t.generateMipmaps=false;
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rx,ry); return t;
}
function grime(x,w,h,seed,amt=1){
  const r=rng(seed);
  for(let i=0;i<w*h*.35*amt;i++){ const v=r(); x.fillStyle=`rgba(${v<.5?'20,16,10':'90,80,60'},${.05+r()*.12})`; x.fillRect(r()*w|0,r()*h|0,1,1); }
  for(let i=0;i<6*amt;i++){ const cx=r()*w, cy=r()*h, rad=2+r()*6;
    x.fillStyle=`rgba(${pick(['40,30,15','60,50,20','30,35,20'])},${.15+r()*.2})`;
    for(let j=0;j<rad*rad;j++){ const a=r()*6.28, d=r()*rad; x.fillRect(cx+Math.cos(a)*d|0,cy+Math.sin(a)*d|0,1,1);} }
}
function mesh(geo,m,x=0,y=0,z=0,parent){ const o=new THREE.Mesh(geo,m); o.position.set(x,y,z); if(parent) parent.add(o); return o; }
const Box=(w,h,d,s=1)=>new THREE.BoxGeometry(w,h,d,Math.max(1,Math.round(w*s)),Math.max(1,Math.round(h*s)),Math.max(1,Math.round(d*s)));
function shadow(parent,r=.36){
  const s=new THREE.Mesh(new THREE.CircleGeometry(r,10),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.45}));
  s.rotation.x=-Math.PI/2; s.position.y=.02; parent.add(s); return s;
}

function buildWorld(){
  renderer=new THREE.WebGLRenderer({canvas:$('cv'),antialias:false});
  renderer.setPixelRatio(1); renderer.setSize(RES[0],RES[1],false);
  const fogC=0x5b5850;
  renderer.setClearColor(fogC);
  scene=new THREE.Scene(); scene.fog=new THREE.Fog(fogC,T.FOG[0],T.FOG[1]);
  camera=new THREE.PerspectiveCamera(58,16/9,.1,60);
  scene.add(new THREE.HemisphereLight(0x9aa08a,0x2a2018,.42));
  // fluorescent fixtures with point lights (vertex-lit, PS1 style)
  for(const [x,z] of [[-5,3.8],[0,4.2],[5,3.8],[0,.6]]){
    const l=new THREE.PointLight(0xe8f0d0,1.1,9,1.6); l.position.set(x,3.9,z); scene.add(l);
    const tube=mesh(Box(1.6,.08,.3),new THREE.MeshBasicMaterial({color:0xe8f0d0}),x,4.3,z,scene);
    mesh(Box(.02,.6,.02),mat(0x202020),x-.6,4.65,z,scene); mesh(Box(.02,.6,.02),mat(0x202020),x+.6,4.65,z,scene);
    lights.push({l,tube,base:1.1,off:0});
  }
  lights[3].bad=true; lights[0].bad=true;

  // dirty kitchen floor
  const floorTex=tex(64,64,(x,w,h)=>{
    for(let i=0;i<8;i++) for(let j=0;j<8;j++){ x.fillStyle=(i+j)%2?'#bdb39a':'#3c4a44'; x.fillRect(i*8,j*8,8,8); }
    x.fillStyle='rgba(20,16,10,.35)'; for(let i=0;i<=64;i+=8){ x.fillRect(i,0,1,64); x.fillRect(0,i,64,1); }
    grime(x,w,h,11,2.2);
  },14/8,8/8);

function buildStation(s){

  const tint=[], M=(c,o)=>{ const m=mat(c,o); tint.push(m); return m; };
  const steel=M(0x9a988e), steelD=M(0x6a6860);
  const o={g,tint,top:1};
  if(s.id==='quesa'){
    mesh(Box(w,.9,d,3),[steelD,steelD,steel,steel,steelD,steelD],0,.45,0,g);
    mesh(Box(w-.1,.08,d-.1),M(0x222020),0,.94,0,g);

    for(let i=0;i<3;i++){ const b=mesh(new THREE.CylinderGeometry(.13,.13,.6,6),mat(0xd0c4a0),-.4+i*.4,1.08,0,g); b.rotation.x=Math.PI/2; }
    mesh(Box(w-.1,.5,d-.1),psx(new THREE.MeshLambertMaterial({color:0xa0b0a0,transparent:true,opacity:.25})),0,1.18,0,g);

    for(let i=0;i<4;i++){ const t=mesh(new THREE.CylinderGeometry(.2,.2,.32,8,1,false,0,Math.PI),mat(0xb8983a),-.5+i*.33,1.05,0,g); t.rotation.z=Math.PI/2; t.rotation.y=Math.PI/2; }
    o.top=1.4;

    mesh(new THREE.CylinderGeometry(.42,.38,.45,10),M(0x6a6860),-.15,1.02,0,g);
    o.cheese=mesh(new THREE.CylinderGeometry(.38,.38,.04,10),mat(0xb88a2a),-.15,1.25,0,g);
    mesh(Box(.45,.1,.6),M(0x9a8a40),.4,.85,0,g);
    o.top=1.5;
  } else if(s.id==='drink'){
    const blue=M(0x3a6070), blueD=M(0x24404a);
    mesh(Box(w,.9,d,3),[blueD,blueD,blue,blue,blue,blueD],0,.45,0,g);
    mesh(Box(w-.1,1.1,.7,3),[blueD,blueD,blue,blue,blue,blueD],0,1.45,-.3,g);
    o.panel=mesh(Box(w-.4,.35,.03),new THREE.MeshBasicMaterial({color:0x8ab0b8}),0,1.7,.06,g);
    mesh(Box(.16,.16,.2),M(0x101010),0,1.0,.12,g);
    o.stream=mesh(Box(.06,.12,.06),new THREE.MeshBasicMaterial({color:0x8ab0c0}),0,.93,.12,g); o.stream.visible=false;
    o.cup=mesh(new THREE.CylinderGeometry(.13,.1,.28,8),mat(0x4a7a90),0,1.04,.12,g); o.cup.visible=false;

  // backlit menu box above the station (the label floats in front of it)
  o.box=mesh(Box(1.3,.36,.12),new THREE.MeshBasicMaterial({color:0x7a6a40}),0,o.top+.25,0,g);

function makePerson(c){
  const g=new THREE.Group(), body=new THREE.Group(); g.add(body); body.scale.setScalar(1.25);
  const legs=[];
  for(const s of [-1,1]){ const p=new THREE.Group(); p.position.set(s*.11,.5,0); body.add(p); mesh(Box(.18,.5,.2),mat(c.pants),0,-.25,0,p); legs.push(p); }
  const shirt=mat(c.shirt);
  mesh(Box(.5,.55,.32),shirt,0,.78,0,body);
  const arms=[];
  for(const s of [-1,1]){ const p=new THREE.Group(); p.position.set(s*.31,1.0,0); body.add(p); mesh(Box(.13,.45,.15),shirt,0,-.2,0,p); mesh(Box(.12,.1,.13),mat(c.skin),0,-.46,0,p); arms.push(p); }
  if(c.apron) mesh(Box(.46,.26,.02),mat(0x9a3a40),0,.64,.17,body);
  const headG=new THREE.Group(); headG.position.y=1.06; body.add(headG);
  const head=mesh(Box(.38,.38,.36),mat(c.skin),0,.19,0,headG);
  for(const s of [-1,1]) mesh(Box(.07,.08,.02),mat(0x050505),s*.08,.22,.185,headG);
  const mouth=mesh(Box(.14,.03,.02),mat(0x1a0a0a),0,.1,.185,headG);
  if(c.cap){ mesh(Box(.42,.13,.4),mat(0x2a2a30),0,.43,0,headG); mesh(Box(.42,.03,.2),mat(0x2a2a30),0,.38,.28,headG); }
  else { mesh(Box(.41,.12,.39),mat(c.hair),0,.41,0,headG); mesh(Box(.41,c.longHair?.42:.2,.08),mat(c.hair),0,c.longHair?.18:.28,-.17,headG); }
  shadow(g);
  return {g,body,legs,arms,head,headG,mouth,skin:c.skin,walk:0};
}
function animPerson(p,moving,dt,speed=11){
  p.walk=moving?p.walk+dt*speed:0;
  const a=moving?Math.sin(p.walk)*.55:0;
  p.legs[0].rotation.x=a; p.legs[1].rotation.x=-a;
  p.arms[0].rotation.x=-a*.7; p.arms[1].rotation.x=a*.7;
  p.body.position.y=moving?Math.abs(Math.sin(p.walk))*.04:0;
}

function zoneFor(x,z,cur){
  const atCounter=z<2.3||(z<2.9&&cur[0]==='c');
  if(atCounter){ if(x<-.4) return 'cL'; if(x>.4) return 'cR'; return cur[0]==='c'?cur:(x<0?'cL':'cR'); }
  if(x<-.9) return 'L'; if(x>-.1) return 'R'; return (cur==='L'||cur==='R')?cur:(x<-.5?'L':'R');
}
function setCam(key){
  const c=CAMS[key]; camKey=key;
  camera.fov=c.fov; camera.updateProjectionMatrix();
  camera.position.set(...c.pos); camera.lookAt(...c.at);
  const f=new THREE.Vector3(c.at[0]-c.pos[0],0,c.at[2]-c.pos[2]).normalize();
  camBasis={fx:f.x,fz:f.z,rx:-f.z,rz:f.x};
}
let camBasis, moveBasis=null;

/* ================= UI overlay ================= */
const ui=$('ui'), V=new THREE.Vector3();
function place(el,x,y,z){
  V.set(x,y,z).project(camera);
  const vis=V.z<1&&Math.abs(V.x)<1.05&&Math.abs(V.y)<1.05;
  if(!vis){ el.style.visibility='hidden'; return false; }
  el.style.visibility='';
  el.style.left=((V.x+1)/2*100).toFixed(2)+'%'; el.style.top=((1-V.y)/2*100).toFixed(2)+'%';
  return true;
}
function el(cls,html=''){ const d=document.createElement('div'); d.className=cls; d.innerHTML=html; ui.appendChild(d); return d; }
function float(x,y,z,txt,col){ const f=el('float',txt); f.style.color=col; if(!place(f,x,y,z)){ f.style.visibility=''; f.style.left='50%'; f.style.top='45%'; } setTimeout(()=>f.remove(),1600); }

function say(t){ msgEl.textContent=t; msgEl.hidden=false; msgT=2.2; }

function grain(){

/* ================= sound ================= */
let ac, hum;
function audio(){ try{ ac ||= new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); }catch(e){} return ac; }
function beep(f=600,d=.07,type='square',v=.04){
  const a=audio(); if(!a) return;
  try{ const o=a.createOscillator(), gn=a.createGain(); o.type=type; o.frequency.value=f; gn.gain.value=v;
    o.connect(gn); gn.connect(a.destination); gn.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);
    o.start(); o.stop(a.currentTime+d);}catch(e){}
}
function startHum(){
  const a=audio(); if(!a||hum) return;
  try{
    const out=a.createGain(); out.gain.value=.05; out.connect(a.destination);
    const lp=a.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=380; lp.connect(out);
    for(const [f,t,v] of [[55,'sine',.6],[58.3,'sine',.5],[120,'square',.05]]){ const o=a.createOscillator(), gn=a.createGain(); o.type=t; o.frequency.value=f; gn.gain.value=v; o.connect(gn); gn.connect(lp); o.start(); }
    hum=out;
  }catch(e){}
}

let S, last=0;
function newGame(){
  if(S) for(const c of S.custs) scene.remove(c.m.g);
  ui.querySelectorAll('.float').forEach(f=>f.remove());
  S={t:0,cash:0,strikes:0,served:0,wrong:0,tossed:0,streak:0,best:0,running:true,
     p:{x:-1.5,z:6.5,face:Math.PI},hands:[],sel:0,
     st:STATIONS.map((s,i)=>({...s,state:'idle',t:0,o:stationObjs[i],tag:S?S.st[i].tag:null})),
     slots:SLOT_X.map((x,i)=>({x,i,c:null,tk:S?S.slots[i].tk:null})),custs:[],spawnIn:2};
  for(const s of S.st){
    if(!s.tag){ s.tag=el('tag',`<div class="sign"><i>${img(s.id)}</i>${s.label}</div><div class="stat" hidden></div>`); s.stat=s.tag.querySelector('.stat'); }
    else s.stat=s.tag.querySelector('.stat');
    s.stat.hidden=true; s.stat.dataset.k='';
  }
  const rail=$('rail');
  S.slots.forEach((sl,i)=>{ if(!sl.tk){ sl.tk=document.createElement('div'); rail.appendChild(sl.tk); } sl.tk.className='ticket empty'; sl.tk.style.setProperty('--r',(i%2?1:-1)*(.6+i*.3)+'deg'); sl.tk.innerHTML=''; });
  slotBags.forEach(b=>b.visible=false);
  setCam(zoneFor(S.p.x,S.p.z,'L')); moveBasis=null;
  renderHands(); renderHud();
}
const progress=()=>Math.min(1,S.t/T.SHIFT);

function spawn(){
  const free=S.slots.filter(s=>!s.c); if(!free.length) return;
  const slot=pick(free), k=progress();
  const lo=Math.round(lerp(T.SIZE_START[0],T.SIZE_END[0],k)), hi=Math.round(lerp(T.SIZE_START[1],T.SIZE_END[1],k));
  const n=lo+Math.floor(Math.random()*(hi-lo+1));
  const order=Array.from({length:n},()=>({id:pick(ITEM_IDS),done:false})).sort((a,b)=>ITEM_IDS.indexOf(a.id)-ITEM_IDS.indexOf(b.id));
  const max=(T.PATIENCE_BASE+T.PATIENCE_PER_ITEM*n)*lerp(1,T.PATIENCE_LATE,k);
  const m=makePerson({shirt:pick(SHIRT),skin:pick(SKIN),hair:pick(HAIR),pants:0x1a1a1e,longHair:Math.random()<.4});
  m.g.position.set(slot.x,0,-8); scene.add(m.g);
  const c={z:-8,slot,state:'in',order,max,p:max,lift:0,flash:0,name:pick(NAMES),m,num:S.served+S.custs.length+101};
  slot.c=c; S.custs.push(c); drawTicket(c);
  beep(180,.25,'sine',.05);
}
function drawTicket(c){
  const tk=c.slot.tk; tk.className='ticket';
  tk.innerHTML=`<div class="top"><span class="num">#${c.num}</span><span>${c.name.toUpperCase()}</span></div>
    <div class="items">${c.order.map(o=>`<i class="${o.done?'done':''}">${img(o.id)}</i>`).join('')}</div>
    <div class="wait"><b></b></div>`;
  c.bar=tk.querySelector('.wait b');
}
function clearTicket(c){ c.slot.tk.className='ticket empty'; }

function distRect(px,pz,[x0,z0,x1,z1]){ return Math.hypot(Math.max(x0-px,0,px-x1),Math.max(z0-pz,0,pz-z1)); }
function nearest(){
  let best=null, bd=T.REACH;
  for(const s of S.st){ const d=distRect(S.p.x,S.p.z,s.fp); if(d<bd){bd=d;best={kind:'station',s};} }
  for(const s of S.slots){ const d=distRect(S.p.x,S.p.z,[s.x-1,-.2,s.x+1,0]); if(d<bd+.15){bd=d;best={kind:'slot',s};} }
  return best;
}
const handsFull=()=>S.hands.length>=T.HANDS;
function take(id){ S.hands.push(id); S.sel=S.hands.length-1; renderHands(); }
function drop(){ const id=S.hands.splice(S.sel,1)[0]; S.sel=Math.max(0,Math.min(S.sel,S.hands.length-1)); renderHands(); return id; }

function actA(){
  const n=nearest(); if(!n) return;
  if(n.kind==='station'){
    const s=n.s, name=ITEMS[s.id].n;
    if(s.kind==='grab'||s.state==='ready'){
      if(handsFull()){ say('Your hands are full.'); beep(140,.12); return; }
      if(s.kind==='machine') s.state='idle';
      take(s.id); beep(520,.05,'triangle');
    } else if(s.state==='idle'){ s.state='cooking'; s.t=s.cook; beep(220,.12,'sawtooth',.03); }
    else say(`The ${name} isn't ready.`);
    return;
  }
  const c=n.s.c;
  if(!c||c.state!=='waiting') return;
  if(!S.hands.length){ say(`${c.name} is waiting. ${c.name} is staring at you.`); return; }
  const id=S.hands[S.sel], want=c.order.find(o=>!o.done&&o.id===id);
  drop();
  if(!want){
    S.cash-=T.WRONG_CASH; S.wrong++; S.streak=0; c.p-=c.max*T.WRONG_PATIENCE; c.flash=.8;
    float(c.slot.x,COUNTER_H+1,-.4,`wrong order  -$${T.WRONG_CASH}`,'#c43030');
    say(`${c.name} didn't order that.`); beep(90,.35,'sawtooth',.05); renderHud(); return;
  }
  want.done=true; beep(660,.05,'triangle'); drawTicket(c);
  if(c.order.every(o=>o.done)) pay(c);
}
function pay(c){
  const base=c.order.reduce((a,o)=>a+ITEMS[o.id].price,0), frac=Math.max(0,c.p/c.max);
  S.streak++; S.best=Math.max(S.best,S.streak);
  const tip=Math.round(base*frac*T.TIP_MAX)+(S.streak>=3?S.streak-2:0);
  S.cash+=base+tip; S.served++; c.state='paid'; c.lift=0; clearTicket(c);
  float(c.slot.x,2.4,CUST_Z,`+$${base+tip}`,'#c9a13a');
  if(S.streak>=3) setTimeout(()=>float(c.slot.x,2.4,CUST_Z,`${S.streak} in a row`,'#8fa060'),300);
  beep(740,.08,'triangle'); setTimeout(()=>beep(988,.12,'triangle'),90); renderHud();
}
function actB(){
  if(!S.hands.length) return;
  const id=drop(); S.cash-=T.TOSS_CASH; S.tossed++;
  float(S.p.x,2.4,S.p.z,`-$${T.TOSS_CASH}`,'#c43030'); say(`You threw out the ${ITEMS[id].n}.`); beep(110,.2,'sawtooth',.04); renderHud();
}
function cycle(d){ if(S.hands.length<2) return; S.sel=(S.sel+d+S.hands.length)%S.hands.length; beep(400,.03,'sine'); renderHands(); }

/* ================= input: keyboard, touch, gamepad ================= */
const src={key:{},touch:{},pad:{}}, KEYS=['up','down','left','right','a','b','l','r'];
let prev={}, taps=new Set(), stick=[0,0];
const held=k=>!!(src.key[k]||src.touch[k]||src.pad[k]);
const KEYMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',
  KeyZ:'a',Space:'a',Enter:'a',KeyJ:'a',KeyX:'b',Backspace:'b',KeyK:'b',Escape:'b',KeyQ:'l',KeyE:'r'};
addEventListener('keydown',e=>{
  if(!$('overlay').hidden){ if(e.code==='Enter'||e.code==='Space'){e.preventDefault();$('go')?.click();} return; }
  const k=KEYMAP[e.code]; if(!k) return; e.preventDefault();
  if(!e.repeat) taps.add(k); src.key[k]=1;
});
addEventListener('keyup',e=>{ const k=KEYMAP[e.code]; if(k) src.key[k]=0; });
addEventListener('blur',()=>{ src.key={}; });
document.querySelectorAll('[data-k]').forEach(b=>{
  const k=b.dataset.k;
  const down=e=>{ e.preventDefault(); src.touch[k]=1; taps.add(k); b.classList.add('on'); try{b.setPointerCapture(e.pointerId)}catch(_){} };
  const up=()=>{ src.touch[k]=0; b.classList.remove('on'); };
  b.addEventListener('pointerdown',down); b.addEventListener('pointerup',up);
  b.addEventListener('pointercancel',up); b.addEventListener('lostpointercapture',up);
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
let startHeld=false;
function pollPad(){
  src.pad={}; stick=[0,0];
  const pads=navigator.getGamepads?navigator.getGamepads():[];
  let start=false;
  for(const p of pads){ if(!p) continue;
    const bt=i=>p.buttons[i]&&p.buttons[i].pressed, ax=p.axes||[];
    if(bt(12)) src.pad.up=1; if(bt(13)) src.pad.down=1; if(bt(14)) src.pad.left=1; if(bt(15)) src.pad.right=1;
    if(Math.hypot(ax[0]||0,ax[1]||0)>.3) stick=[ax[0],ax[1]];
    if(bt(0)) src.pad.a=1; if(bt(1)) src.pad.b=1;
    if(bt(4)||bt(6)) src.pad.l=1; if(bt(5)||bt(7)) src.pad.r=1;
    if(bt(9)||bt(0)) start=true;
  }
  if(start&&!startHeld&&!$('overlay').hidden) $('go')?.click();
  startHeld=start;
}
function readInput(){
  pollPad();
  const pr={};
  for(const k of KEYS){ const h=held(k); pr[k]=(h&&!prev[k])||taps.has(k); prev[k]=h; }
  taps.clear(); return pr;
}

/* ================= update ================= */
function blocked(x,z){
  const r=.3;
  if(x<BOUNDS.x0||x>BOUNDS.x1||z<BOUNDS.z0||z>BOUNDS.z1) return true;
  for(const s of STATIONS){ const [x0,z0,x1,z1]=s.fp; if(x>x0-r&&x<x1+r&&z>z0-r&&z<z1+r) return true; }
  return false;
}
function update(dt,pr){
  S.t+=dt;
  const P=S.p;
  let ix=(held('right')?1:0)-(held('left')?1:0), iz=(held('down')?1:0)-(held('up')?1:0);
  if(!ix&&!iz){ ix=stick[0]; iz=stick[1]; }
  const len=Math.hypot(ix,iz); if(len>1){ ix/=len; iz/=len; }
  const moving=len>.1;
  // camera-relative movement; the old direction is kept through a camera cut until you let go
  if(!moving) moveBasis=null; else if(!moveBasis) moveBasis={...camBasis};
  if(moving){
    const b=moveBasis, mx=b.rx*ix-b.fx*iz, mz=b.rz*ix-b.fz*iz;
    const nx=P.x+mx*T.SPEED*dt, nz=P.z+mz*T.SPEED*dt;
    if(!blocked(nx,P.z)) P.x=nx;
    if(!blocked(P.x,nz)) P.z=nz;
    const target=Math.atan2(mx,mz); let d=target-P.face; d=Math.atan2(Math.sin(d),Math.cos(d)); P.face+=d*Math.min(1,dt*14);
  }
  player.g.position.set(P.x,0,P.z); player.g.rotation.y=P.face; animPerson(player,moving,dt,10);
  const z=zoneFor(P.x,P.z,camKey);
  if(z!==camKey){ setCam(z); const cut=$('cut'); cut.classList.add('on'); requestAnimationFrame(()=>requestAnimationFrame(()=>cut.classList.remove('on'))); }

  if(pr.l) cycle(-1);
  if(pr.r) cycle(1);
  if(pr.a) actA();
  if(pr.b) actB();

  for(const s of S.st) if(s.state==='cooking'){
    s.t-=dt; if(s.t<=0){ s.state='ready'; beep(880,.08,'sine',.05); setTimeout(()=>beep(880,.08,'sine',.05),160); }
  }
  S.spawnIn-=dt;
  if(S.spawnIn<=0){ spawn(); S.spawnIn=lerp(T.SPAWN_START,T.SPAWN_END,progress())*(.75+Math.random()*.5); }

  for(const c of S.custs){
    if(c.flash>0) c.flash-=dt;
    let moving=false;
    if(c.state==='in'){
      moving=true; c.z+=1.5*dt; c.m.g.rotation.y=0;
      if(c.z>=CUST_Z){ c.z=CUST_Z; c.state='waiting'; }
    } else if(c.state==='waiting'){
      c.p-=dt;
      if(c.p<=0){
        c.state='out'; c.angry=true; clearTicket(c); S.strikes++; S.streak=0;
        float(c.slot.x,2.4,CUST_Z,'☎︎ called corporate','#c43030'); say(`${c.name} is calling corporate.`); beep(70,.6,'sawtooth',.07); renderHud();
      }
    } else if(c.state==='paid'){
      c.lift+=dt; if(c.lift>.8) c.state='out';
    } else if(c.state==='out'){
      if(c.slot.c===c) c.slot.c=null;
      moving=true; c.z-=1.4*dt; c.m.g.rotation.y=Math.PI;
    }
    c.m.g.position.z=c.z; animPerson(c.m,moving,dt,7);
    const mood=c.state==='waiting'?c.p/c.max:1, mad=c.angry||c.flash>0||mood<.25;
    c.m.head.material.color.setHex(mad?0xb07060:c.m.skin);
    c.m.headG.rotation.z=c.state==='waiting'?(mad?(Math.random()-.5)*.25:Math.sin(S.t*.7+c.slot.x)*.12):0;
    c.m.headG.rotation.x=c.state==='waiting'&&mood<.5?.15:0;
    c.m.mouth.scale.x=mood>.5?1:.4;
  }
  for(const c of S.custs) if(c.state==='out'&&c.z<-8.5){ scene.remove(c.m.g); c.gone=true; }
  S.custs=S.custs.filter(c=>!c.gone);
  if(msgT>0){ msgT-=dt; if(msgT<=0) msgEl.hidden=true; }
  if(S.strikes>=T.STRIKES) end('corporate'); else if(S.t>=T.SHIFT) end('shift');
}

/* ================= draw ================= */
let heldEl, heldKey='', grainT=0;
function draw(dt){
  // lights: a steady buzz, two bad tubes
  for(const L of lights){
    if(L.bad){ if(L.off>0) L.off-=dt; else if(Math.random()<dt*.6) L.off=.05+Math.random()*.35; }
    const on=L.off<=0||Math.random()<.25;
    L.l.intensity=on?L.base*(.94+Math.random()*.06):.15; L.tube.material.color.setHex(on?0xe8f0d0:0x3a3a34);
  }
  neon.material.opacity=Math.random()<.03?.3:.9;

  const near=S.running?nearest():null;
  S.st.forEach(s=>{
    const o=s.o, hi=near&&near.kind==='station'&&near.s===s;
    for(const m of o.tint) m.emissive.setHex(hi?0x3a3010:0);
    o.box.material.color.setHex(hi?0xc0a050:0x6a5a38);
    if(s.id==='quesa'){ const on=s.state==='cooking'; o.bars.forEach(b=>b.material.emissive.setHex(on?0x6a2000:(hi?0x3a3010:0))); o.food.visible=s.state!=='idle'; o.food.material.color.setHex(s.state==='ready'?0xb07a20:0xd0b060); }
    if(s.id==='drink'){ o.stream.visible=s.state==='cooking'&&Math.floor(S.t*10)%2===0; o.cup.visible=s.state!=='idle'; }
    s.tag.classList.toggle('near',!!hi);
    if(s.kind==='machine'&&s.state!=='idle'){
      const k=s.state;
      if(s.stat.dataset.k!==k){ s.stat.dataset.k=k; s.stat.className='stat'+(k==='ready'?' ready':''); s.stat.innerHTML=k==='ready'?'READY':'<div class="bar"><b></b></div>'; }
      if(k==='cooking') s.stat.querySelector('b').style.width=((1-s.t/s.cook)*100)+'%';
      s.stat.hidden=false;
    } else s.stat.hidden=true;
    const [x0,z0,x1,z1]=s.fp; place(s.tag,(x0+x1)/2,o.top+.5,(z0+z1)/2);
  });
  S.slots.forEach(sl=>{
    const b=slotBags[sl.i], c=sl.c, show=c&&(c.state==='waiting'||c.state==='paid');
    b.visible=!!show;
    if(show){
      b.position.y=COUNTER_H+.08+(c.state==='paid'?c.lift*1.2:0); b.position.z=-.45-(c.state==='paid'?c.lift*1.6:0);
      const hi=near&&near.kind==='slot'&&near.s===sl&&c.state==='waiting';
      b.children[0].material.emissive.setHex(hi?0x3a3010:0);
    }
    sl.tk.classList.toggle('near',!!(near&&near.kind==='slot'&&near.s===sl&&c&&c.state==='waiting'));
  });
  for(const c of S.custs) if(c.state==='waiting'){
    const f=Math.max(0,c.p/c.max);
    c.bar.style.width=(f*100)+'%'; c.slot.tk.classList.toggle('late',f<.25);
  }
  const key=S.hands.join(',')+'|'+S.sel;
  if(key!==heldKey){ heldKey=key; heldEl.innerHTML=`<div class="held">${S.hands.map((id,i)=>`<i class="${i===S.sel&&S.hands.length>1?'sel':''}">${img(id)}</i>`).join('')}</div>`; }
  heldEl.hidden=!S.hands.length; place(heldEl,S.p.x,2.6,S.p.z);
  renderer.render(scene,camera);
  grainT-=dt; if(grainT<=0){ grain(); grainT=.07; }
}

/* ================= HTML bits ================= */
function hintText(){
  const n=nearest(), sel=S.hands[S.sel];
  if(n?.kind==='station'){
    const s=n.s, name=ITEMS[s.id].n;
    if(s.kind==='grab') return handsFull()?'Your hands are full.':`A · take a ${name}`;
    if(s.state==='idle') return `A · ${s.verb} ${name}`;
    if(s.state==='cooking') return `${name} · ${Math.ceil(s.t)}s`;
    return `A · take the ${name}`;
  }
  if(n?.kind==='slot'&&n.s.c&&n.s.c.state==='waiting'){
    const c=n.s.c; return sel?`A · put the ${ITEMS[sel].n} in ${c.name}'s bag`:`${c.name}'s bag is empty.`;
  }
  if(S.hands.length>1) return 'L / R · choose what you hold    B · throw it out';
  return S.hands.length?'Take it to the counter.':'Check the tickets.';
}
let hudT=0, lastHint='';
function renderHud(){
  $('cash').textContent=S.cash;
  [...$('strikes').children].forEach((s,i)=>s.classList.toggle('on',i<S.strikes));
  const mins=Math.min(180,Math.floor(S.t/T.SHIFT*180)), h=1+Math.floor(mins/60), m=mins%60;
  $('clock').textContent=`${h}:${String(m).padStart(2,'0')} AM`;
  const ht=S.running?hintText():''; if(ht!==lastHint){ $('hint').textContent=ht; lastHint=ht; }
}
function renderHands(){
  let html='<span class="lbl">L</span>';
  for(let i=0;i<T.HANDS;i++){ const id=S.hands[i];
    html+=id?`<span class="s full${i===S.sel?' sel':''}"><img src="${ICON[id]}" alt="${ITEMS[id].n}"></span>`:'<span class="s"></span>'; }
  $('hands').innerHTML=html+'<span class="lbl">R</span>';
}

function frame(now){
  const dt=Math.min(.1,(now-last)/1000||0); last=now;
  const pr=readInput();
  if(S.running) update(dt,pr);
  else player.g.position.set(S.p.x,0,S.p.z);
  draw(dt);
  hudT-=dt; if(hudT<=0){ renderHud(); hudT=.1; }
  requestAnimationFrame(frame);
}

function end(why){
  S.running=false; renderHud();
  const t=$('clock').textContent;
  showCard(`
    <h1>${why==='corporate'?'Corporate <em>is here.</em>':'4:00 <em>AM.</em>'}</h1>
    <p>${why==='corporate'?`It's ${t}. Three people called. There's a car in the lot with its headlights off, and someone in a tie is standing at the back door.`:'The fog is lifting. The next shift isn\'t coming. You count the drawer anyway.'}</p>
    <div class="big">$${S.cash}</div>
    <ul><li>${S.served} bags handed out</li><li>Best streak: ${S.best}</li><li>${S.wrong} wrong items bagged</li><li>${S.tossed} items thrown out</li><li>${S.strikes} calls to corporate</li></ul>
    <button class="go" id="go">Clock in again</button>`);
}
function showCard(html){ $('card').innerHTML=html; $('overlay').hidden=false; $('go')?.focus(); }
document.addEventListener('click',e=>{ if(e.target.id==='go'){ $('overlay').hidden=true; startHum(); newGame(); beep(330,.2,'sine'); } });
document.addEventListener('visibilitychange',()=>{ last=performance.now(); });

/* ================= boot ================= */
if(!window.THREE){
  showCard(`<h1>Closed <em>for the night.</em></h1><p>The 3D engine didn't load. Check your connection and reload the page.</p>`);
} else {
  (document.fonts?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]):Promise.resolve()).finally(()=>{
    buildWorld();
    msgEl=el('msg'); msgEl.hidden=true; heldEl=el('tag'); heldEl.hidden=true;
    newGame(); S.running=false;
    showCard(`
      <h1>Crunch <em>Time</em></h1>
      <p>1:00 a.m. The fog rolled in around midnight. You're the only one on shift, and they keep coming to the counter.</p>
      <ul>
        <li>Orders print on the ticket rail at the top. Each ticket matches a bag on the counter.</li>
        <li>Walk to a station and press A to take food. The grill and the fountain need a press to start. Come back when they're done.</li>
        <li>You can carry 5 things. L / R picks which one you're holding out.</li>
        <li>Stand at a bag and press A to put the item in. Get it wrong and it costs you.</li>
        <li>If they wait too long, they call corporate. Three calls and corporate comes.</li>
      </ul>
      <p class="keys">Keyboard: arrows or WASD to walk, Q / E for L / R, Z = A, X = B. Controllers work too. Sound on.</p>
      <button class="go" id="go">Clock in</button>`);
    requestAnimationFrame(frame);
  });
}
</script>
